<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Glowgarden: A Math Adventure</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="screen-title" class="screen">
  <div class="titlebox">
    <div class="titleemoji">🌻</div>
    <h1>Glowgarden</h1>
    <p>A math adventure</p>
    <button id="btn-play" class="btn big go">Play ▶</button>
  </div>
</div>
<div id="screen-home" class="screen hidden"></div>
<div id="screen-world" class="screen hidden">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud">
      <button id="hud-home" class="btn round" aria-label="Home">🏠</button>
      <span id="hud-zone" class="chip"></span>
      <span id="hud-coins" class="chip"></span>
      <span id="hud-pieces" class="chip"></span>
      <span id="hud-gems" class="chip"></span>
      <span id="hud-magic" class="chip magic"></span>
      <button id="hud-hint" class="btn round" aria-label="Hint">🐝</button>
    </div>
  </div>
</div>
<div id="modal" class="hidden"></div>
<div id="toasts"></div>
<script src="js/problems.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/world.js"></script>
<script src="js/main.js"></script>
</body>
</html>
